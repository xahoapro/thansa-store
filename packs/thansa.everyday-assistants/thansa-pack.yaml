format: thansa-pack
spec: 1
id: thansa.everyday-assistants
version: 1.1.0
replaces:
  - thansa.tro-ly-hang-ngay
name:
  vi: Trợ lý hàng ngày
  en: Everyday assistants
description:
  vi: '3 trợ lý dùng mỗi ngày, không cần quy trình đi kèm: một thư ký dọn hộp thư và sắp việc trong ngày,
    một người tóm tắt tài liệu dài thành quyết định và việc cần làm, một người phản biện soi lỗ hổng trong
    kế hoạch trước khi bạn bắt tay vào làm.'
  en: '3 everyday agents that work standalone: a secretary who triages the inbox and orders the day, a
    summariser who turns long documents into decisions and actions, and a devil''s advocate who finds
    the holes in a plan before you commit to it.'
author: {name: Thansa}
license: MIT
homepage: "https://github.com/xahoapro/thansa-store"
compat: {app: ">=0.440.0"}
provides:
  agents: [tl-thu-ky, tl-tom-tat, tl-phan-bien]
