# Gói "Thansa Gate": cổng cho ChatGPT, Claude và AI khác làm việc cùng Thansa.
#
# Tiền thân là "Thansa trong ChatGPT" (mã cũ thansa.thansa-trong-chatgpt, plugin thansa-trong-chatgpt).
# 2.0.0 đổi mã sang tiếng Anh, thêm Claude, và cho AI bên ngoài nhắn thẳng vào hội thoại của Thansa
# (Thansa 0.440.0) thay vì giao việc qua Kanban. `replaces` báo cho Thansa biết đây là bản cập nhật của
# gói cũ: cài lên là token, mức quyền và địa chỉ đã dán vào ChatGPT được giữ nguyên.
format: thansa-pack
spec: 1

id: thansa.gate
version: 2.1.0
replaces:
  - thansa.thansa-trong-chatgpt

name:
  vi: Thansa Gate
  en: Thansa Gate
description:
  vi: Cổng cho ChatGPT, Claude và AI khác làm việc cùng Thansa. AI đó đọc hội thoại của Thansa, tư vấn cho bạn, và khi bạn đồng ý thì nhắn thẳng vào khung chat để Thansa làm tiếp. Bạn xem được tiến độ, Thansa nhớ lại cho lần sau. Cần Thansa 0.440.0 trở lên, mật khẩu quản trị và tên miền https.
  en: A gate for ChatGPT, Claude and other AIs to work with Thansa. The AI reads your Thansa chats, advises you, and once you agree posts straight into the chat so Thansa carries on. You watch the progress, Thansa remembers it next time. Needs Thansa 0.440.0 or newer, an admin password and an https domain.

author:
  name: Thansa
license: MIT
homepage: https://github.com/xahoapro/thansa-store/tree/main/packs/thansa.gate

# 0.440.0 mở bốn tool chat cho cửa Gate (`mcp_hub.tra_loi_jsonrpc(gate=...)`) và cơ chế đổi mã gói
# (`replaces`). Bản cũ hơn thì gói bị tắt kèm lý do đọc được.
compat:
  app: ">=0.440.0"

provides:
  plugins:
    - plugins/thansa-gate
