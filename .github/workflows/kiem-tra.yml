# Kiểm mọi gói trước khi trộn vào kho.
#
# Vì sao kho cần CI dù nó chỉ là dữ liệu: gói trong đây tới máy người dùng mà KHÔNG qua một bản
# Thansa mới. Không có lần phát hành nào đứng chắn phía sau, nên chỗ chắn duy nhất là đây.
#
# Không cài gì cả - `tools/kiem-tra.py` chỉ dùng thư viện chuẩn. Chạy hết trong vài giây.
name: Kiểm kho

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Gói có mã gọi vào module của lõi Thansa (zalo_cli, image_vision...). Lõi đổi mà gói gãy thì phải
  # biết trong một ngày, không phải đợi tới lúc có người sửa kho.
  schedule:
    - cron: "17 2 * * *"

# Ba job dưới đây chỉ ĐỌC kho. Chúng chạy mã không phải của kho (test của gói, MCP bên thứ 3 bản mới nhất, lệnh
# viết trong skill theo repo gốc), nên token của lượt chạy không được có quyền ghi, và không nằm lại trong
# `.git/config` cho các bước đó đọc (10/11/2026).
permissions:
  contents: read

jobs:
  kiem-tra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kiểm cấu trúc gói, an toàn quyền, và danh mục
        run: python tools/kiem-tra.py

  # Test của gói CÓ MÃ (tests/<id gói>/test_*.py). Plugin trong gói chạy BÊN TRONG máy chủ Thansa và import
  # module của nó, nên test chạy trên bản thansa-os mới nhất (nhánh main).
  test-goi-co-ma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: xahoapro/thansa-os
          path: thansa-os
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài thư viện của Thansa OS
        run: pip install -r thansa-os/requirements.txt
      - name: Chạy test các gói có mã
        env:
          THANSA_OS_DIR: ${{ github.workspace }}/thansa-os
        run: |
          set -e
          shopt -s nullglob
          for f in tests/*/test_*.py; do echo "== $f"; python "$f"; done

  # MCP bên thứ 3 đi theo bản chính thức mới nhất (@latest), nên bên đó ra bản mới là mọi máy chạy
  # bản đó ngay. Job này chạy thử bản mới nhất THẬT của từng MCP, phân loại tool thật bằng đúng hàm
  # của Thansa, và đỏ khi có tool phá huỷ hay tiêu tiền chưa được xếp vào nhóm nguy hiểm. Chạy mỗi
  # ngày (lịch ở trên) là để bản mới của bên thứ 3 lộ ra trong một ngày.
  soi-ban-moi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: xahoapro/thansa-os
          path: thansa-os
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - name: Soi bản mới nhất của từng MCP bên thứ 3
        env:
          THANSA_OS_DIR: ${{ github.workspace }}/thansa-os
        run: python tools/soi-ban-moi.py
